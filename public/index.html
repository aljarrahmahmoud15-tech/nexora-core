<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07111d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NEXORA Command</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f9;--panel:#fff;--ink:#0d1b2a;--mute:#5d6d7e;--line:#dde4ec;--soft:#eaf1f7;--ok:#0a8f6a;--warn:#b7791f;--bad:#c53030;--sig:#0b7fa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#07111d;--panel:#0e1b2b;--ink:#e8f0f8;--mute:#8da0b3;--line:#1c2e44;--soft:#12243a;--ok:#3ddc9b;--warn:#f2c14e;--bad:#ff7a7a;--sig:#4cc9f0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,Tahoma,sans-serif;line-height:1.6;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:620px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:20px 0 10px}h3{margin:0 0 6px;font-size:15px}
.sub{color:var(--mute);font-size:13px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
button,input{font:inherit}
input{width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px}
input[dir=ltr]{text-align:left}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--sig);border-color:var(--sig);color:var(--bg);font-weight:700}
.btn:disabled{opacity:.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.alert{border:1px solid var(--bad);border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px}
.big{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.big strong{font-size:48px;line-height:1;font-weight:700;letter-spacing:-1px}
.big span{color:var(--mute);font-size:14px}
.big em{margin-inline-start:auto;font-style:normal;font-weight:700;color:var(--sig);font-size:18px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sg{display:grid;gap:4px;text-align:center}
.sg small{font-size:12px;color:var(--mute)}.sg b{font-size:14px}
.col{height:44px;border-radius:8px;background:var(--soft);display:flex;align-items:flex-end;overflow:hidden}
.col i{display:block;width:100%;border-radius:8px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:99px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.sum strong{display:block;font-size:26px;line-height:1.1}.sum span{font-size:12px;color:var(--mute)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}.item .t{font-weight:500}.item .m{font-size:12.5px;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none}.dot.bad{background:var(--bad)}
.bot{background:var(--panel);border:1px solid var(--line);border-inline-start:4px solid var(--acc);border-radius:16px;padding:14px;margin-bottom:12px}
.bh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.bh .t{font-weight:700}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--mute)}.tag.ok{color:var(--ok);border-color:var(--ok)}
.part{display:flex;justify-content:space-between;gap:10px;background:var(--soft);border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:8px}
.part span:first-child{color:var(--mute)}
.g{color:var(--ok)}.w{color:var(--warn)}.r{color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--mute)}.stats b{display:block;font-size:19px;color:var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts a,.acts button{text-align:center;border:1px solid var(--sig);color:var(--sig);background:none;border-radius:10px;padding:9px;font-size:13.5px;font-weight:500;text-decoration:none;cursor:pointer}
.acts [aria-disabled=true]{border-color:var(--line);color:var(--mute);pointer-events:none}
.fm{display:grid;gap:8px;margin-top:10px}
.err{color:var(--bad);font-size:13px;min-height:1em}
code{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.tk{display:block;word-break:break-all;background:var(--soft);padding:10px;border-radius:10px;margin-top:6px}
.note{font-size:12.5px;color:var(--mute);text-align:center;margin-top:14px}
label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
select{width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ok-note{color:var(--ok);font-size:13px}
nav{position:fixed;inset-inline:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 4px;font-size:13.5px;border-radius:10px;cursor:pointer}
nav button[aria-selected=true]{color:var(--sig);background:var(--soft);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>NEXORA Command</h1><div class="sub" id="sub">مركز إدارة تشغيلي</div></div>
    <div><button class="btn" id="own-btn">دخول المالك</button> <button class="btn" id="refresh">تحديث</button></div>
  </header>
  <div class="card" id="own" hidden>
    <label class="sub" for="tok">رمز المالك</label>
    <div class="fm"><input id="tok" type="password" dir="ltr" autocomplete="off"><div class="err" id="oerr" role="alert"></div>
    <button class="btn pri" id="ologin">دخول</button></div>
    <div class="sub" style="margin-top:8px">الرمز يبقى في ذاكرة الصفحة فقط، ويُمحى عند الخروج أو بعد 15 دقيقة خمولاً.</div>
  </div>
  <div class="alert" id="fail" role="alert" hidden>تعذّر قراءة النبض من الخادم. تُعرض آخر بيانات وصلت، وستُعاد المحاولة تلقائياً.</div>
  <div id="view"></div>
  <noscript><div class="card">تحتاج هذه الصفحة إلى تفعيل جافاسكربت.</div></noscript>
  <div class="note" id="stamp"></div>
</div>
<nav role="tablist" aria-label="الأقسام">
  <button role="tab" data-t="center" aria-selected="true">المركز</button>
  <button role="tab" data-t="bots" aria-selected="false">البوتات</button>
  <button role="tab" data-t="log" aria-selected="false">السجل</button>
</nav>
<script src="app.js"></script>
</body>
</html>
